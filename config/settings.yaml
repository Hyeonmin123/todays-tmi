# 별 - 인스타그램 자동 발행 설정
# 이 파일은 저장소에 커밋됩니다. 비밀값(토큰)은 여기 두지 말고 GitHub Actions Secrets 에 넣으세요.

# 계정 핸들 (이미지 워터마크에 표시). @ 포함해서 입력.
# ↓ 실제로 가입한 인스타그램 아이디로 바꾸세요.
handle: "@today.tminformation"

# 평상시 발행 간격(일). 1 = 매일, 2 = 2일에 1개.
interval_days: 1

# 발행 시각(KST). 부스트 기간엔 boost_slots_kst, 그 외엔 slots_kst 를 쓴다.
# 슬롯 시각 s 이후 slot_tolerance_hours 안에 실행되면 그 슬롯 발행분으로 인정.
# 그 시간을 넘겨 실행되면(스케줄러 지연 등) 그 슬롯은 건너뜀 → 발행 시각이 크게 안 튄다.
boost_until: "2026-09-09"
boost_slots_kst: [8, 14, 20]
slots_kst: [8]
slot_tolerance_hours: 3.5

# 직전 발행에서 이 시간(h)이 안 지났으면 스킵 (몰아 올리기 방지).
min_hours_between_posts: 5

# 큐에서 트랙을 꺼내는 순환 순서. 지금은 TMI(A) 단일 트랙.
# (생활 꿀팁은 content/bank_kkultip.parked.json 으로 보류됨)
rotation: [A]

# 큐(미발행 문구)가 이 개수 미만이면 GitHub 이슈로 "문구 보충" 알림.
low_queue_threshold: 5

# 해시태그: 항목별 5개(hashtags) + 그날 주제 관련 5개(extra_hashtags) = 10개.
# 발행 이력이 이 수치 미만인 동안만 extra_hashtags 를 붙이고, 넘으면 기본 5개만.
# (0 으로 두면 항상 5개만. 늘리면 그만큼 오래 10개 유지)
extra_hashtags_until_post: 30

# Instagram API 설정 (Instagram 로그인 방식)
api_base: "https://graph.instagram.com"
graph_api_version: v21.0

# 캐러셀과 함께 같은 내용을 릴스(세로 영상)로도 발행.
also_post_reel: true
# 릴스 배경음악 mp3 경로(저장소 기준). 비우면 무음 → 인스타 앱에서 오디오 추가 권장.
reel_audio: ""

# 발행 시각(참고용, KST). 실제 트리거는 워크플로 cron 에서 UTC 로 설정.
publish_hour_kst: 8

# 이미지 크기 (인스타 세로형 4:5 권장)
size: [1080, 1350]

# 안전 여백(px)
margin: 96

# 비주얼 테마 (노트/필기 스타일). 칩 라벨은 둘 다 "오늘의 TMI" 로 통일.
tracks:
  A:
    name: "오늘의 TMI"
    bg: "#FCFBF6"      # 따뜻한 종이색
    fg: "#2B2A25"      # 잉크
    accent: "#FFD64A"  # 형광펜
    sub: "#8A7A5C"     # 라벨·밑줄·핸들
  B:
    name: "오늘의 TMI"
    bg: "#FCFBF6"
    fg: "#2B2A25"
    accent: "#FFD64A"
    sub: "#8A7A5C"

# 폰트 (assets/fonts/ 기준). 제목=굵은 고딕, 본문=손글씨
fonts:
  title: "DoHyeon-Regular.ttf"
  bold: "Gaegu-Bold.ttf"
  regular: "Gaegu-Regular.ttf"
