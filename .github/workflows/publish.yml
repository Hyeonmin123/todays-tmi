name: 자동 발행

on:
  schedule:
    # KST 08 / 14 / 20 시 + 지연 대비 +30/+90분 재시도. run_daily 가 슬롯·중복을 판단.
    - cron: "0 23 * * *"    # 08:00 KST
    - cron: "30 23 * * *"   # 08:30
    - cron: "30 0 * * *"    # 09:30
    - cron: "0 5 * * *"     # 14:00
    - cron: "30 5 * * *"    # 14:30
    - cron: "30 6 * * *"    # 15:30
    - cron: "0 11 * * *"    # 20:00
    - cron: "30 11 * * *"   # 20:30
    - cron: "30 12 * * *"   # 21:30
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
