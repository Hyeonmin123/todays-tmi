name: 자동 발행

on:
  # 2026-09-14: media_publish 가 오류를 반환했는데 실제로는 발행된 사고 발생.
  # src/publish.py 에 안전장치(find_recent_media) 추가 후 스케줄 재개.
  schedule:
    - cron: "7 21 * * *"    # 06:07 KST
    - cron: "37 21 * * *"   # 06:37
    - cron: "22 22 * * *"   # 07:22
    - cron: "7 0 * * *"     # 09:07 KST
    - cron: "37 0 * * *"    # 09:37
    - cron: "22 1 * * *"    # 10:22
    - cron: "7 9 * * *"     # 18:07 KST
    - cron: "37 9 * * *"    # 18:37
    - cron: "22 10 * * *"   # 19:22
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
