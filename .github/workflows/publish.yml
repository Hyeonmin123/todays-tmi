name: 자동 발행

on:
  schedule:
    # KST 08 / 14 / 20 시 + 재시도. GitHub 는 정각·30분처럼 딱 떨어지는 시각에
    # 예약 작업이 몰려 더 늦게 처리된다고 공식적으로 밝힘 -> 분을 어긋나게 잡음.
    - cron: "7 23 * * *"    # 08:07 KST
    - cron: "37 23 * * *"   # 08:37
    - cron: "22 0 * * *"    # 09:22
    - cron: "7 5 * * *"     # 14:07
    - cron: "37 5 * * *"    # 14:37
    - cron: "22 6 * * *"    # 15:22
    - cron: "7 11 * * *"    # 20:07
    - cron: "37 11 * * *"   # 20:37
    - cron: "22 12 * * *"   # 21:22
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
