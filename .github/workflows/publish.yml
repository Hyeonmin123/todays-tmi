name: 자동 발행

on:
  # 2026-09-14: media_publish 가 오류를 반환했는데 실제로는 발행된 사고 발생.
  # src/publish.py 에 안전장치(find_recent_media) 추가 후 스케줄 재개.
  # 2026-09-15: 슬롯이 [6,9,18]이라 6시-9시 창이 겹쳐서(허용오차 4.5h > 3h 간격)
  # 아침 발행이 9시(점심) 슬롯으로 잘못 잡히고 점심 슬롯이 통째로 날아가는 버그 발견.
  # 점심 목표를 2시(14:00)로 잡고 슬롯을 6,12,18로 6시간 간격 벌림(겹침 해소).
  # 2026-09-21: 각 슬롯은 "목표 시각 2시간 전부터 1시간 간격 3번, 마지막 크론 = 목표 시각".
  # GitHub 크론이 보통 1~3시간 늦게 돌아서 첫 크론이 목표 시각 즈음에 실제로 실행되고,
  # 안 돌면 마지막 크론(목표 시각)이 안전빵. 이미 그 슬롯 발행분이 있으면 나머지는 스킵된다.
  schedule:
    - cron: "0 21 * * *"    # 06:00 KST (목표 08:00 아침)
    - cron: "0 22 * * *"    # 07:00
    - cron: "0 23 * * *"    # 08:00  <- 마지막
    - cron: "0 3 * * *"     # 12:00 KST (목표 14:00 점심)
    - cron: "0 4 * * *"     # 13:00
    - cron: "0 5 * * *"     # 14:00  <- 마지막
    - cron: "0 8 * * *"     # 17:00 KST (목표 19:00 저녁)
    - cron: "0 9 * * *"     # 18:00
    - cron: "0 10 * * *"    # 19:00  <- 마지막
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
