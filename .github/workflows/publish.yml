name: 자동 발행

on:
  # 2026-09-14: media_publish 가 오류를 반환했는데 실제로는 발행된 사고 발생.
  # src/publish.py 에 안전장치(find_recent_media) 추가 후 스케줄 재개.
  # 2026-09-15: 슬롯이 [6,9,18]이라 6시-9시 창이 겹쳐서(허용오차 4.5h > 3h 간격)
  # 아침 발행이 9시(점심) 슬롯으로 잘못 잡히고 점심 슬롯이 통째로 날아가는 버그 발견.
  # 점심 목표를 2시(14:00)로 잡고 슬롯을 6,12,18로 6시간 간격 벌림(겹침 해소).
  schedule:
    - cron: "7 21 * * *"    # 06:07 KST (목표 08:00)
    - cron: "37 21 * * *"   # 06:37
    - cron: "22 22 * * *"   # 07:22
    - cron: "7 3 * * *"     # 12:07 KST (목표 14:00)
    - cron: "37 3 * * *"    # 12:37
    - cron: "22 4 * * *"    # 13:22
    - cron: "7 10 * * *"    # 19:07 KST (릴스 전용, 저녁 슬롯 19시)
    - cron: "37 10 * * *"   # 19:37
    - cron: "22 11 * * *"   # 20:22
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
