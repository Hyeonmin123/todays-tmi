name: 자동 발행

on:
  schedule:
    # GitHub 예약 실행이 몇 시간씩 밀리는 고질병이 있어서, 슬롯 시각 "이후"에
    # 재시도하는 대신 슬롯 2시간 "전"부터 미리 찔러본다 -> 밀리더라도 실제
    # 실행이 슬롯 시각 부근에 걸릴 확률이 높아짐. 이르게 실행돼도 아직 슬롯이
    # 아니면 src.run_daily 의 slot_check 가 스스로 걸러내 조용히 종료하니
    # 안전함. 정각·30분엔 예약 작업이 몰려 더 늦게 처리된다고 GitHub가 공식
    # 언급 -> 마지막 '정각' 시도 말고는 분을 어긋나게 잡음.
    # 08:00 슬롯 (06:07 -> 06:47 -> 07:27 -> 08:00 정각/최종)
    - cron: "7 21 * * *"
    - cron: "47 21 * * *"
    - cron: "27 22 * * *"
    - cron: "0 23 * * *"
    # 11:00 슬롯 (09:07 -> 09:47 -> 10:27 -> 11:00 정각/최종)
    - cron: "7 0 * * *"
    - cron: "47 0 * * *"
    - cron: "27 1 * * *"
    - cron: "0 2 * * *"
    # 20:00 슬롯 (18:07 -> 18:47 -> 19:27 -> 20:00 정각/최종)
    - cron: "7 9 * * *"
    - cron: "47 9 * * *"
    - cron: "27 10 * * *"
    - cron: "0 11 * * *"
  # 외부 스케줄러(cron-job.org)가 정시에 이 이벤트를 쏜다. GitHub cron 지연 회피용.
  # 위 schedule 은 외부 트리거가 죽었을 때의 백업.
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
