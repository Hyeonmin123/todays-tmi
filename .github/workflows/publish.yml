name: 자동 발행

on:
  schedule:
    # KST 06 / 09 / 18 시(= 체감 08/11/20시에서 2시간 당김, settings.yaml 참고)
    # + 재시도. GitHub 는 정각·30분처럼 딱 떨어지는 시각에 예약 작업이 몰려
    # 더 늦게 처리된다고 공식적으로 밝힘 -> 분을 어긋나게 잡음.
    - cron: "7 21 * * *"    # 06:07 KST
    - cron: "37 21 * * *"   # 06:37
    - cron: "22 22 * * *"   # 07:22
    - cron: "7 0 * * *"     # 09:07 KST
    - cron: "37 0 * * *"    # 09:37
    - cron: "22 1 * * *"    # 10:22
    - cron: "7 9 * * *"     # 18:07 KST
    - cron: "37 9 * * *"    # 18:37
    - cron: "22 10 * * *"   # 19:22
  # 외부 스케줄러(cron-job.org)가 정시에 이 이벤트를 쏜다. GitHub cron 지연 회피용.
  # 위 schedule 은 외부 트리거가 죽었을 때의 백업.
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      force:
        description: "발행일이 아니어도 강제 발행"
        type: boolean
        default: false
      dry_run:
        description: "렌더까지만 (발행 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.run_daily $ARGS
